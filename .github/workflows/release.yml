name: frp linux amd64 release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22.x"

      - name: Build frpc and frps (linux/amd64, no web)
        run: |
          mkdir -p dist
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 \
            go build -tags no_web -o dist/frpc ./cmd/frpc

          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 \
            go build -tags no_web -o dist/frps ./cmd/frps

      - name: Package
        run: |
          cd dist
          tar -czf frp_linux_amd64.tar.gz frpc frps

      - name: Upload GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/frp_linux_amd64.tar.gz
