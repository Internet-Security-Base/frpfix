name: frp linux amd64 release (with web)

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22.x"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      # ===== 构建 frps Web =====
      - name: Build frps web assets
        working-directory: web/frps
        run: |
          npm install
          npm run build

      # ===== 构建 frpc Web =====
      - name: Build frpc web assets
        working-directory: web/frpc
        run: |
          npm install
          npm run build

      # ===== 编译二进制（此时 dist 已存在）=====
      - name: Build frpc and frps
        run: |
          mkdir -p dist
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 \
            go build -o dist/frpc ./cmd/frpc

          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 \
            go build -o dist/frps ./cmd/frps

      - name: Package
        run: |
          cd dist
          tar -czf frp_linux_amd64.tar.gz frpc frps

      - name: Upload GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/frp_linux_amd64.tar.gz
